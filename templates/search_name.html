{% extends "base.html" %}
{% block title %}
    <title>學生資料管理系統 - 依姓名搜尋</title>
{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-body p-4">
        <form action="{% url 'search_list' %}" method="get">
            <div class="mb-3">
                <label for="cname" class="form-label">姓名</label>
                <input type="text" class="form-control" id="cname" name="cname">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-pink px-4">搜尋</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
