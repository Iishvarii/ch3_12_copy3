<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-bg: #fff5f7;
            --pink-light: #ffe4ec;
            --pink: #ffc2d1;
            --pink-dark: #ff8fab;
            --pink-deep: #e8638a;
            --text-main: #5a4a4f;
        }
        body {
            background-color: var(--pink-bg);
            font-family: 'Noto Sans TC', 'Segoe UI', sans-serif;
            color: var(--text-main);
        }
        .navbar-pink {
            background-color: #fff;
            border-bottom: 2px solid var(--pink-light);
        }
        .navbar-pink .navbar-brand {
            color: var(--pink-deep);
            font-weight: 700;
        }
        .navbar-pink .nav-link {
            color: var(--text-main);
        }
        .navbar-pink .nav-link:hover {
            color: var(--pink-deep);
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 16px rgba(232, 99, 138, 0.12);
        }
        .card-header-pink {
            background-color: var(--pink-light);
            border-radius: 1rem 1rem 0 0 !important;
            color: var(--pink-deep);
            font-weight: 700;
        }
        .btn-pink {
            background-color: var(--pink-dark);
            border-color: var(--pink-dark);
            color: #fff;
        }
        .btn-pink:hover {
            background-color: var(--pink-deep);
            border-color: var(--pink-deep);
            color: #fff;
        }
        .btn-outline-pink {
            border-color: var(--pink-dark);
            color: var(--pink-deep);
        }
        .btn-outline-pink:hover {
            background-color: var(--pink-dark);
            color: #fff;
        }
        .table thead th {
            background-color: var(--pink-light);
            color: var(--pink-deep);
            border-color: var(--pink);
        }
        .table-hover tbody tr:hover {
            background-color: var(--pink-bg);
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--pink-dark);
            box-shadow: 0 0 0 0.2rem rgba(255, 143, 171, 0.25);
        }
        .form-check-input:checked {
            background-color: var(--pink-dark);
            border-color: var(--pink-dark);
        }
        .pagination .page-link {
            color: var(--pink-deep);
        }
        .pagination .page-item.active .page-link {
            background-color: var(--pink-dark);
            border-color: var(--pink-dark);
        }
        .page-footer {
            color: #b98a9a;
            font-size: 0.85rem;
        }
    </style>
    {% block title %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand navbar-pink shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">🌸 學生資料管理系統</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'index' %}">首頁</a>
                <a class="nav-link" href="{% url 'post' %}">新增學生資料</a>
            </div>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
    <footer class="text-center page-footer pb-4">
        &copy; {% now "Y" %} 學生資料管理系統
    </footer>
</body>
</html>
